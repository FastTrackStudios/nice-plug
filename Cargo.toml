[workspace]
resolver = "3"
members = [
  "crates/nice-plug",
  "crates/nice-plug-core",
  "crates/nice-plug-derive",
  "crates/nice-plug-xtask",
  "crates/nice-log",
  "crates/cargo-nice-plug",
  "crates/xtask",
  # FTS delta: excluded on the FTS toolchain pin (rust 1.94). Upstream moved
  # nice-plug-egui to egui 0.36, which requires rustc 1.95. FTS ships the
  # dioxus backend and does not build this one; restore it when the pin moves.
  #"crates/nice-plug-egui",
  "crates/nice-plug-iced",
  # FTS delta: the Dioxus/Blitz editor backend.
  "crates/nice-plug-dioxus",

  "examples/byo_gui_gl",
  "examples/byo_gui_softbuffer",
  "examples/byo_gui_wgpu",
  "examples/gain",
  #"examples/gain_egui",  # see nice-plug-egui above
  "examples/gain_iced",
  #"examples/iced_audio_widget",
  "examples/midi_inverter",
  "examples/poly_mod_synth",
  "examples/sine",
  "examples/stft",
  "examples/sysex",
]
default-members = ["crates/nice-plug"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
authors = [
  "Robbert van der Helm <mail@robbertvanderhelm.nl>",
  "Billy Messenger <billydm@noreply.codeberg.org>",
]
license = "ISC"
repository = "https://codeberg.org/RustAudio/nice-plug"

[workspace.dependencies]
# FTS delta: nice-plug-dioxus inherits baseview from the workspace. Upstream
# declares it per-crate instead, so this entry is ours. Kept at "0.3" so the
# consuming workspace decides the exact patch level.
baseview = "0.3"
anyhow = "1.0.104"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
atomic_float = "1.1"
atomic_refcell = "0.1"
bitflags = "2"
raw-window-handle = "0.6"
realfft = "3.0"
approx = "0.5.1"
crossbeam = "0.8"
triple_buffer = "9.0.0"
rtrb = "0.4.0"
semver = "1.0.27"
pollster = "1.0.1"
parking_lot = "0.12"
thiserror = "2"
windows = ">=0.59, <=0.62"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["smallvec", "fmt", "tracing-log", "std"] }

# FTS delta: the Dioxus/Blitz forks architect v0.10.0 pins, in the same
# `[patch]` shape, so nice-plug-dioxus builds here against exactly what a
# consuming workspace (studio) resolves. Patches in a dependency's workspace do
# not reach its consumers, so each consumer carries these too. Keep them in
# lockstep with architect's Cargo.toml.
[patch.crates-io]
# Blitz from the FTS fork (DioxusLabs/blitz main 0.3.0-beta.4 + the FTS
# changes), one tag across every blitz crate and anyrender 0.14.
blitz-dom = { git = "https://github.com/FastTrackStudios/blitz", tag = "fts-upstream-2026-11" }
blitz-traits = { git = "https://github.com/FastTrackStudios/blitz", tag = "fts-upstream-2026-11" }
blitz-paint = { git = "https://github.com/FastTrackStudios/blitz", tag = "fts-upstream-2026-11" }
blitz-shell = { git = "https://github.com/FastTrackStudios/blitz", tag = "fts-upstream-2026-11" }
blitz-net = { git = "https://github.com/FastTrackStudios/blitz", tag = "fts-upstream-2026-11" }
blitz-html = { git = "https://github.com/FastTrackStudios/blitz", tag = "fts-upstream-2026-11" }
anyrender = { git = "https://github.com/FastTrackStudios/blitz", tag = "fts-upstream-2026-11" }
# Renderer/windowing forks from FastTrackStudios/vendor (each one's reason is
# in vendor's README): Vello's window renderer and compositor, the hybrid
# renderer, winit's UIKit backend, wgpu's Metal layer.
anyrender_vello = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.0" }
anyrender_vello_hybrid = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.0" }
winit-uikit = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.0" }
wgpu-hal = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.0" }
raw-window-metal = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.0" }

# The Dioxus crates from the FTS vendor fork (each one's reason is in its
# UPSTREAM.md): dioxus-native, dioxus-native-dom, dioxus-vdom (upstream's
# renamed dioxus-core).
[patch."https://github.com/DioxusLabs/dioxus"]
dioxus-native = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.0" }
dioxus-native-dom = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.0" }
dioxus-vdom = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.0" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[profile.ci]
inherits = "dev"
opt-level = 0
debug = 0
