[package]
name = "nice-plug-dioxus"
version = "0.1.0"
# NOTE: kept on edition 2021 (the workspace is 2024). The Dioxus/Blitz rendering
# code was authored against 2021 and isn't audited for 2024's stricter rules yet.
# Revisit once the port is green.
edition = "2021"
authors = ["Cody Wright"]
license = "ISC"
description = "Dioxus Native GUI support for nice-plug (Blitz + Vello + wgpu)"

[features]
default = ["hot-reload"]
hot-reload = ["dep:dioxus-devtools"]
# Embedded editor support (REAPER TCP/MCP inline UI).
# NOT YET AVAILABLE in the nice-plug port: requires the embedded-editor API to be
# ported into nice-plug-core first (see src/embedded.rs). Enabling this currently
# emits a compile_error with instructions.
embedded = ["dep:anyrender_vello_cpu"]
# Use CPU rendering with softbuffer (works on Linux/XWayland where wgpu surfaces fail)
cpu-rendering = ["dep:anyrender_vello_cpu", "dep:softbuffer"]
# Use wgpu offscreen rendering + softbuffer blit (works on Linux/XWayland, keeps GPU rendering)
softbuffer-blit = ["dep:softbuffer"]

[dependencies]
# The nice-plug core abstraction layer (Editor trait, GuiContext, Params, persist).
nice-plug-core = { path = "../nice-plug-core", version = "0.3.0" }

# dioxus-native re-exports dioxus and carries the Blitz renderer. The rev must
# match architect's (v0.10.0: DioxusLabs/dioxus main 430cfb56, the
# 0.8.0-alpha.3 line) in lockstep with every other dioxus-* entry, so a
# consuming workspace resolves one Dioxus. The workspace root's
# `[patch."https://github.com/DioxusLabs/dioxus"]` swaps in the FTS vendor
# fork, the same way architect does.
dioxus-native = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", features = ["prelude"] }

# Blitz. Dioxus' git pin requires `=0.3.0-beta.4`; the workspace root patches
# these to the FastTrackStudios/blitz tag architect uses.
blitz-dom = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"

# Rendering — matched to architect v0.10.0's stack (anyrender 0.14 /
# anyrender_vello 0.15 / vello 0.11 / wgpu 30 / wgpu_context 0.10 /
# anyrender_vello_cpu 0.18). Keeping these in lockstep with Blitz guarantees a
# single resolved version of `anyrender` so its `PaintScene` trait lines up.
# anyrender and anyrender_vello are patched in the workspace root to the
# FastTrackStudios forks (blitz tag / vendor tag).
anyrender_vello = "0.15"
vello = { version = "0.11", features = ["wgpu"] }
wgpu = "30"
wgpu_context = "0.10"  # For DeviceHandle type used by CustomPaintSource

# anyrender base traits (RenderContext / ResourceId) — re-exported for consumers
# implementing wgpu custom-paint <canvas> sources via the texture-registration API.
anyrender = "0.14"

# CPU rendering for embedded editor (optional)
anyrender_vello_cpu = { version = "0.18", optional = true }
softbuffer = { version = "0.4", optional = true }

# Window management. Upstream crates.io baseview, shared with the rest of the
# workspace — 0.3 links raw-window-handle 0.6 natively, which is the only reason
# the old vendored fork existed (blitz/wgpu need 0.6). 0.3 also brings the
# host-callback API (`baseview::host`) that backs plugin-driven window resizing.
baseview = { workspace = true }

# Same raw-window-handle major as baseview 0.3, wgpu, and softbuffer.
raw-window-handle = "0.6"
x11-dl = "2"

# Hot reload
dioxus-devtools = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", optional = true }

# Utilities
crossbeam = "0.8"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
futures-util = "0.3"
pollster = "0.4"
libc = "0.2"
# Use the same keyboard-types version as baseview 0.3 to avoid conflicts
keyboard-types = "0.8"
# Same smol_str version as blitz-traits for BlitzKeyEvent text field
smol_str = "0.3"
cursor-icon = "1"
# `data:` URL decoding for the editor's resource provider (src/net.rs).
# The same crate blitz's own provider uses, so no second implementation of
# the format and no version skew in how a document's images decode.
data-url = "0.3"

[dev-dependencies]
# Example needs these directly
pollster = "0.4"

# macOS only: baseview never learns that a PARENT resized our view. It calls
# `resized()` only from `view_did_change_backing_properties`, which nothing
# invokes on an external frame change (there is no NSViewFrameDidChange
# observer), and `WindowContext::size()` returns a cached value updated in that
# same place. So the editor polls the live NSView each frame instead — see
# `macos_live_geometry` in window.rs. Versions match baseview 0.3's own objc2.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSResponder",
    "NSView",
    "NSWindow",
] }
